name: Coordinate quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx eslint next.config.ts src scripts tests
      - run: npm test
      - run: npm run audit:coordinates
      - run: npx tsc --noEmit
      # Build the committed, audited snapshot without contacting keyed collection APIs.
      - run: npm run build:static
