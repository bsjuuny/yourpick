name: Coordinate quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx eslint next.config.ts src/app/layout.tsx src/app/page.tsx src/app/list/page.tsx src/components/layout/Layout.tsx src/components/layout/Navbar.tsx src/components/SearchForm.tsx src/components/DonationPopup.tsx src/components/InstitutionCard.tsx src/types/institution.ts src/utils/institutionSort.ts scripts/fetch-data.js scripts/audit-coordinates.js scripts/geo/validate-coordinates.js scripts/read-api-response.js scripts/check-export.cjs tests/*.cjs
      - run: npm test
      - run: npm run audit:coordinates
      - run: npx tsc --noEmit
      # Build the committed, audited snapshot without contacting keyed collection APIs.
      - run: npm run build:static
